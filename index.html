  <title>Julia · Mi Taller de UX</title>
  
  <!-- Tipografías: Bebas Neue para títulos condensados, Space Mono para estética técnica/garage -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #121212;
      font-family: 'Space Mono', monospace;
      color: #F3ECDD;
      overflow-x: hidden;
    }

    /* ==========================================
       VERSIÓN ESCRITORIO (Por defecto para pantallas > 768px)
       ========================================== */
    .desktop-version {
      display: block;
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .hero-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: 1;
    }

    .top-nav {
      position: absolute;
      top: 24px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .btn-garage {
      background-color: #cfd8c7;
      color: #1c2619;
      border: 2px solid #232b20;
      padding: 6px 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 19px;
      letter-spacing: 0.08em;
      text-decoration: none;
      box-shadow: 2px 2px 0px #121212;
      transition: all 0.15s ease-in-out;
      cursor: pointer;
      text-align: center;
    }

    .btn-garage:hover {
      background-color: #ffd100;
      color: #121212;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #121212;
    }

    .btn-garage.cv-btn {
      background-color: #ffd100;
      color: #121212;
    }

    .btn-garage.cv-btn:hover {
      background-color: #d62828;
      color: #F3ECDD;
    }

    .hero-content {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      width: 100%;
      max-width: 900px;
      padding: 0 20px;
      z-index: 10;
    }

    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 7vw, 100px);
      line-height: 0.95;
      letter-spacing: 0.05em;
      color: #F3ECDD;
      text-shadow: 4px 4px 0px #121212, 0 0 20px rgba(0,0,0,0.8);
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: clamp(11px, 1.2vw, 16px);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #F3ECDD;
      text-shadow: 2px 2px 4px #121212;
      margin-bottom: 4px;
    }

    .hero-tagline {
      font-size: clamp(10px, 1vw, 14px);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffd100;
      text-shadow: 2px 2px 4px #121212;
    }

    /* Por defecto ocultamos la versión mobile en computadoras */
    .mobile-version {
      display: none;
    }

    /* ==========================================
       VERSIÓN MÓVIL (Se activa en pantallas <= 768px)
       ========================================== */
    @media (max-width: 768px) {
      .desktop-version {
        display: none !important; /* Oculta la versión de escritorio */
      }

      .mobile-version {
        display: flex !important;
        width: 100%;
        min-height: 100vh;
        position: relative;
        background: #30312D;
        overflow-x: hidden;
        flex-direction: column;
        justify-content: flex-start;
        align-items: flex-start;
      }
    }
  </style>
</head>

      <p class="hero-tagline">Adelante, este es mi taller...</p>
    </section>
  </main>
