<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia · Mi Taller de UX</title>
  
  <!-- Tipografías: Bebas Neue para títulos condensados, Space Mono para estética técnica/garage -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #121212;
      font-family: 'Space Mono', monospace;
      color: #F3ECDD;
    }

    /* Contenedor principal adaptable */
    .workshop-hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: url('taller.jpg') no-repeat center top;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    /* Botonera superior */
    .top-nav {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      z-index: 10;
    }

    /* Botones estilo garage */
    .btn-garage {
      background-color: #cfd8c7;
      color: #1c2619;
      border: 2px solid #232b20;
      padding: 6px 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 19px;
      letter-spacing: 0.08em;
      text-decoration: none;
      box-shadow: 2px 2px 0px #121212;
      transition: all 0.15s ease-in-out;
      cursor: pointer;
      text-align: center;
    }

    .btn-garage:hover {
      background-color: #ffd100;
      color: #121212;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #121212;
    }

    .btn-garage:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #121212;
    }

    .btn-garage.cv-btn {
      background-color: #ffd100;
      color: #121212;
    }

    /* Contenedor de texto inferior */
    .hero-content {
      text-align: center;
      width: 100%;
      max-width: 900px;
      margin: 40px auto 20px auto;
      padding: 16px 20px;
      background: rgba(18, 18, 18, 0.65); /* Fondo oscuro semitransparente para legibilidad */
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 9vw, 100px);
      line-height: 1;
      letter-spacing: 0.05em;
      color: #F3ECDD;
      text-shadow: 3px 3px 0px #121212;
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: clamp(12px, 3.2vw, 16px);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #F3ECDD;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .hero-tagline {
      font-size: clamp(11px, 2.8vw, 14px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffd100;
    }

    /* Ajustes específicos para pantallas de celular (menos de 768px) */
    @media (max-width: 768px) {
      .workshop-hero {
        background-size: cover;
        background-position: 35% center; /* Centra el personaje y el auto en pantallas verticales */
        justify-content: flex-start;
        gap: 30px;
        padding: 16px;
      }

      .top-nav {
        display: grid;
        grid-template-columns: repeat(2, 1fr); /* 2 columnas de botones en celular */
        gap: 8px;
        width: 100%;
      }

      .btn-garage {
        font-size: 17px;
        padding: 8px 6px;
      }

      .btn-garage.cv-btn {
        grid-column: span 2; /* El botón de CV ocupa todo el ancho */
      }

      .hero-content {
        margin-top: auto; /* Empuja el texto hacia abajo de forma orgánica sin desbordar */
        margin-bottom: 16px;
        padding: 14px;
      }
    }
  </style>
</head>
<body>

  <main class="workshop-hero">
    <!-- Menú de navegación superior -->
    <nav class="top-nav">
      <a href="#sobre-mi" class="btn-garage">Sobre Mí</a>
      <a href="#proyectos" class="btn-garage">Proyectos</a>
      <a href="#prototipos" class="btn-garage">Prototipos</a>
      <a href="#dis-grafico" class="btn-garage">Dis. Gráfico</a>
      <a href="#contacto" class="btn-garage">Contacto</a>
      <a href="CV_Julia_UX.pdf" target="_blank" class="btn-garage cv-btn">Descarga Mi CV</a>
    </nav>

    <!-- Tipografía central / inferior -->
    <section class="hero-content">
      <h1 class="hero-title">HOLA, SOY JULIA</h1>
      <p class="hero-subtitle">Diseño experiencias digitales claras, útiles y con impacto real</p>
      <p class="hero-tagline">Adelante, este es mi taller...</p>
    </section>
  </main>

</body>
</html>
