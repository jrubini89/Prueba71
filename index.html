<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia · Mi Taller de UX</title>
  
  <!-- Tipografías: Bebas Neue para títulos condensados, Space Mono para estética técnica/garage -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: 'Space Mono', monospace;
      color: #F3ECDD;
    }

    /* Contenedor principal con la ilustración de fondo */
    .workshop-hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      /* Asegúrate de nombrar tu imagen como taller.jpg y ponerla en la misma carpeta que index.html */
      background: url('taller.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Barra superior de navegación / Botonera de taller */
    .top-nav {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      padding: 24px 40px;
      z-index: 10;
    }

    /* Botones estilo chapa/taller vintage */
    .btn-garage {
      background-color: #cfd8c7;
      color: #1c2619;
      border: 2px solid #232b20;
      padding: 6px 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 19px;
      letter-spacing: 0.08em;
      text-decoration: none;
      box-shadow: 2px 2px 0px #121212;
      transition: all 0.15s ease-in-out;
      cursor: pointer;
    }

    .btn-garage:hover {
      background-color: #ffd100;
      color: #121212;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #121212;
    }

    .btn-garage:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #121212;
    }

    /* Botón destacado CV */
    .btn-garage.cv-btn {
      background-color: #ffd100;
      color: #121212;
    }

    .btn-garage.cv-btn:hover {
      background-color: #d62828;
      color: #F3ECDD;
    }

    /* Área inferior de texto de bienvenida */
    .hero-content {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      width: 100%;
      max-width: 900px;
      padding: 0 20px;
      pointer-events: none;
    }

    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(60px, 9vw, 110px);
      line-height: 0.95;
      letter-spacing: 0.05em;
      color: #F3ECDD;
      text-shadow: 4px 4px 0px #121212, 0 0 20px rgba(0,0,0,0.8);
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: clamp(12px, 1.3vw, 16px);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #F3ECDD;
      text-shadow: 2px 2px 4px #121212;
      margin-bottom: 6px;
    }

    .hero-tagline {
      font-size: clamp(11px, 1.1vw, 14px);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffd100;
      text-shadow: 2px 2px 4px #121212;
    }

    /* Adaptabilidad básica */
    @media (max-width: 860px) {
      .top-nav {
        flex-wrap: wrap;
        justify-content: center;
        padding: 16px;
      }
      .btn-garage {
        font-size: 16px;
        padding: 5px 10px;
      }
      .hero-content {
        bottom: 40px;
      }
    }
  </style>
</head>
<body>

  <main class="workshop-hero">
    <!-- Menú de navegación superior -->
    <nav class="top-nav">
      <a href="#sobre-mi" class="btn-garage">Sobre Mí</a>
      <a href="#proyectos" class="btn-garage">Proyectos</a>
      <a href="#prototipos" class="btn-garage">Prototipos</a>
      <a href="#dis-grafico" class="btn-garage">Dis. Gráfico</a>
      <a href="#contacto" class="btn-garage">Contacto</a>
      <a href="CV_Julia_UX.pdf" target="_blank" class="btn-garage cv-btn">Descarga Mi CV</a>
    </nav>

    <!-- Tipografía central / inferior -->
    <section class="hero-content">
      <h1 class="hero-title">HOLA, SOY JULIA</h1>
      <p class="hero-subtitle">Diseño experiencias digitales claras, útiles y con impacto real</p>
      <p class="hero-tagline">Adelante, este es mi taller...</p>
    </section>
  </main>

</body>
</html>
