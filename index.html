    * {

      margin: 0;
      padding: 0;

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: 'Space Mono', monospace;
      color: #F3ECDD;
    }

    /* Contenedor principal con la ilustración de fondo */
    .workshop-hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      /* Asegúrate de nombrar tu imagen como taller.jpg y ponerla en la misma carpeta que index.html */
      background: url('taller.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Barra superior de navegación / Botonera de taller */
    .top-nav {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      padding: 24px 40px;
      z-index: 10;
    }
