<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julia · Mi Taller de UX</title>
  
  <!-- Tipografías: Bebas Neue para títulos condensados, Space Mono para estética técnica/garage -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #121212;
      font-family: 'Space Mono', monospace;
      color: #F3ECDD;
      overflow-x: hidden;
    }

    /* Contenedor principal que asegura que la imagen cubra toda la pantalla sin distorsión */
    .workshop-hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Imagen real integrada para que ocupe y respete las proporciones exactas */
    .hero-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: 1;
    }

    /* Botonera superior estilo chapa/taller vintage */
    .top-nav {
      position: absolute;
      top: 24px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .btn-garage {
      background-color: #cfd8c7;
      color: #1c2619;
      border: 2px solid #232b20;
      padding: 6px 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 19px;
      letter-spacing: 0.08em;
      text-decoration: none;
      box-shadow: 2px 2px 0px #121212;
      transition: all 0.15s ease-in-out;
      cursor: pointer;
      text-align: center;
    }

    .btn-garage:hover {
      background-color: #ffd100;
      color: #121212;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #121212;
    }

    .btn-garage:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #121212;
    }

    .btn-garage.cv-btn {
      background-color: #ffd100;
      color: #121212;
    }

    .btn-garage.cv-btn:hover {
      background-color: #d62828;
      color: #F3ECDD;
    }

    /* Área inferior de texto de bienvenida */
    .hero-content {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      width: 100%;
      max-width: 900px;
      padding: 0 20px;
      z-index: 10;
    }

    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 7vw, 100px);
      line-height: 0.95;
      letter-spacing: 0.05em;
      color: #F3ECDD;
      text-shadow: 4px 4px 0px #121212, 0 0 20px rgba(0,0,0,0.8);
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: clamp(11px, 1.2vw, 16px);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #F3ECDD;
      text-shadow: 2px 2px 4px #121212;
      margin-bottom: 4px;
    }

    .hero-tagline {
      font-size: clamp(10px, 1vw, 14px);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffd100;
      text-shadow: 2px 2px 4px #121212;
    }

    /* Adaptabilidad específica para celulares y tablets (menos de 860px) */
    @media (max-width: 860px) {
      .workshop-hero {
        height: 100dvh; /* Se adapta dinámicamente a la barra del navegador móvil */
      }

      .hero-bg-img {
        object-position: 32% center; /* Desplaza el encuadre en celular para mostrar al personaje y al auto */
      }

      .top-nav {
        top: 16px;
        right: 16px;
        left: 16px;
        display: grid;
        grid-template-columns: repeat(2, 1fr); /* Botones ordenados en 2 columnas limpias */
        gap: 6px;
      }

      .btn-garage {
        font-size: 15px;
        padding: 5px 8px;
      }

      .btn-garage.cv-btn {
        grid-column: span 2; /* El botón de descarga de CV ocupa toda la fila inferior */
      }

      .hero-content {
        bottom: 30px;
        padding: 0 12px;
      }
    }
  </style>
</head>
<body>

  <main class="workshop-hero">
    <!-- Imagen de fondo integrada como etiqueta HTML para evitar recortes de CSS -->
    <img src="taller.jpg" alt="Mi Taller de UX - Fondo" class="hero-bg-img">

    <!-- Menú de navegación superior -->
    <nav class="top-nav">
      <a href="#sobre-mi" class="btn-garage">Sobre Mí</a>
      <a href="#proyectos" class="btn-garage">Proyectos</a>
      <a href="#prototipos" class="btn-garage">Prototipos</a>
      <a href="#dis-grafico" class="btn-garage">Dis. Gráfico</a>
      <a href="#contacto" class="btn-garage">Contacto</a>
      <a href="CV_Julia_UX.pdf" target="_blank" class="btn-garage cv-btn">Descarga Mi CV</a>
    </nav>

    <!-- Tipografía central / inferior -->
    <section class="hero-content">
      <h1 class="hero-title">HOLA, SOY JULIA</h1>
      <p class="hero-subtitle">Diseño experiencias digitales claras, útiles y con impacto real</p>
      <p class="hero-tagline">Adelante, este es mi taller...</p>
    </section>
  </main>

</body>
</html>
